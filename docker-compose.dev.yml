# CHỈ DÙNG KHI PHÁT TRIỂN (không bàn giao cho khách dùng). Phải ghi rõ khi chạy:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Mount mã nguồn vào web và chạy gunicorn --reload để sửa code/chạy test không cần build lại image.
# Cài thật và nghiệm thu chỉ dùng docker-compose.yml (lệnh "docker compose up" không đọc file này).
# Chỉ service web được mount; scheduler vẫn chạy mã trong image (không cần reload).
services:
  web:
    volumes:
      - .:/app
      - /app/staticfiles # giữ staticfiles đã collectstatic trong image, không bị thư mục máy chủ đè
    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
        "--worker-class",
        "gthread",
        "--threads",
        "4",
        "--timeout",
        "120",
        "--reload",
      ]
