{% extends "base_tam.html" %}
{% block title %}Mật khẩu tạm{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h4 mb-3">Mật khẩu tạm</h1>
  <div class="card card-body">
    <p>Tài khoản <strong>{{ target.username }}</strong>:</p>
    <p class="fs-4 font-monospace" id="temp-password">{{ temp }}</p>
    <p class="small text-muted">Mật khẩu này chỉ hiện một lần. Hãy chuyển cho người dùng; họ phải đổi mật khẩu ở lần đăng nhập đầu tiên.</p>
    <div class="text-end"><a class="btn btn-primary" href="{% url 'user_list' %}">Quay lại danh sách</a></div>
  </div>
</div></div>
{% endblock %}
