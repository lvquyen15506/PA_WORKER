services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment: # chỉ 3 biến; Compose lấy giá trị từ .env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    # không có "ports": chỉ web và scheduler truy cập được

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/private_media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/dang-nhap/', timeout=5)"]
      interval: 10s
      start_period: 60s
      retries: 10

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "manage.py", "run_scheduler"]
    volumes:
      - media:/app/private_media

volumes:
  pgdata:
  media:
