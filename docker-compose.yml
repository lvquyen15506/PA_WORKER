# Tên dự án cố định: giải nén bản mới vào thư mục tên khác vẫn dùng đúng volume dữ liệu cũ.
name: pa_worker

# Xoay vòng log của mọi container: tối đa 5 tệp × 10 MB mỗi container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    image: pa_worker-db
    restart: unless-stopped
    logging: *logging
    environment: # chỉ 3 biến; Compose lấy giá trị từ .env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    # không có "ports": chỉ web và scheduler truy cập được

  web:
    build: .
    image: pa_worker-web
    restart: unless-stopped
    logging: *logging
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PA_PORT:-8000}:8000"
    volumes:
      - media:/app/private_media
      - ./backups:/backups # file sao lưu (mã hóa) nằm ở thư mục backups cạnh tệp này
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/dang-nhap/', timeout=5)"]
      interval: 10s
      start_period: 60s
      retries: 10

  scheduler:
    build: .
    image: pa_worker-web
    restart: unless-stopped
    logging: *logging
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "manage.py", "run_scheduler"]
    volumes:
      - media:/app/private_media
      - ./backups:/backups

volumes:
  pgdata:
  media:
